# Swept/versioned configuration for the Phase 0 data-acquisition pipeline
# and the Phase 1 trajectory/manifest/visualization pipeline.
#
# Per CLAUDE.md's coding conventions ("Config lives in versioned config
# files, not hardcoded constants"), these values are what `dvc.yaml`'s
# stages read - editing a value here and running `dvc repro` (or
# `dvc exp run --set-param ...` for a one-off sweep) is how a pipeline
# stage's inputs are meant to change, not editing the scripts.
#
# aoi.* is shared across all three Phase 0 acquisition stages so the
# imagery, streets, and LIDAR pulls stay aligned to the same envelope.
# Bbox coordinates are EPSG:4326 (lon/lat degrees) - see
# docs/INTEGRATION_PLAN.md ss1/ss2 on the WGS84-for-storage convention.
aoi:
  min_lon: -121.95
  min_lat: 37.30
  max_lon: -121.85
  max_lat: 37.36

imagery:
  output_dir: data/raw/dpw_imagery
  base_url: https://geo.sanjoseca.gov/server/rest/services
  name_contains: DPW_Imagery
  coverage_sample_size: 25
  # `level` is intentionally left unwired into dvc.yaml: the fetch script
  # auto-detects the finest LOD with real coverage for the AOI (see
  # scripts/fetch_historic_imagery.py's --level help), and that
  # auto-detection is itself the behavior worth pinning in most runs. Set
  # this and add `--level ${imagery.level}` to the fetch_imagery stage's
  # cmd if a run ever needs to force a specific level.
  level: null

streets:
  output: data/raw/csj_streets/aoi.geojson
  base_url: https://geo.sanjoseca.gov/server/rest/services
  root: OPN
  service_name_contains: OpenDataService
  layer_name_contains: Streets
  # "Streets" is an ambiguous name in CSJ's catalog - as of this pin,
  # `--list-layers` finds 3 matches under OPN/OPN_OpenDataService: this one
  # (`Streets`, MapServer/60 - confirmed the full-attribute centerline layer:
  # has FOCWIDTH, FEATURECLASS, STREETCLASS/FUNCTCLASS, and its 35,811
  # records match the City's own Open Data page's reported record count for
  # this exact layer), `Underground Designated Streets` (MapServer/522 - the
  # sparser layer a prior session's substring search drifted onto, with no
  # width field or FEATURECLASS at all), and `Paving Moratorium Streets`
  # (MapServer/423, uncharacterized - almost certainly not centerlines).
  # `layer_url` pins the confirmed one explicitly so a future catalog
  # reorganization can't silently resolve to a different match again (see
  # docs/phase2_ground_truth_rasterization.md's "'Streets' is an ambiguous
  # name in CSJ's catalog" section for the full field reference and how this
  # was confirmed). root/service_name_contains/layer_name_contains are kept
  # for `--list-layers`/re-discovery if this URL ever needs re-pinning - set
  # `layer_url: ""` to fall back to substring discovery.
  layer_url: https://geo.sanjoseca.gov/server/rest/services/OPN/OPN_OpenDataService/MapServer/60
  # Resolved: `FEATURECLASS='StreetCenterline'` is the confirmed filter -
  # `--list-fields` against MapServer/60's untruncated metadata shows
  # FEATURECLASS is a citywide shared domain (also covers sewer/storm-water
  # infrastructure like `ssGravityMain`/`swPressurizedMain`, parcels,
  # address points, etc. - `StreetCenterline` is one value among 36), not a
  # street-specific one. Non-street utility lines under other FEATURECLASS
  # values can run parallel/close to real streets, which is exactly the
  # kind of geometry that occluded a real street's pixels in
  # docs/phase2_ground_truth_rasterization.md's "Overlapping/occluding
  # segments" incident - filtering to `StreetCenterline` here removes them
  # at the source. (`STREETCLASS`/`FUNCTCLASS` are a different axis - they
  # classify *within* `StreetCenterline`, e.g. `AL`: Alley, `DW`: Driveway,
  # `RA`: Ramp are still legitimate street centerlines, not something to
  # filter out here.)
  #
  # NOTE: `scripts/fetch_csj_streets.py` itself now defaults `--layer-url`/
  # `--where` to these exact values (DEFAULT_LAYER_URL/DEFAULT_WHERE) - a
  # real re-pull done by invoking the script directly (bypassing this file
  # and `dvc repro` entirely, e.g. with a custom `--bbox`/`--output`) still
  # came back unfiltered/undiscovered before that fix, since only this file
  # had been updated. Keep both in sync if either one is ever re-pinned.
  where: "FEATURECLASS='StreetCenterline'"
  page_size: 2000

lidar:
  output: data/raw/lidar/aoi_dem.tif
  width: 512
  height: 512
  pixel_type: F32

# Phase 1 (trajectory/ManifestBuilder + viz) - see
# docs/phase1_trajectory_manifests.md and docs/INTEGRATION_PLAN.md ss6.
# `manifest.scenario` is the versioned CONOPS/trajectory-set config
# (configs/scenarios/*.yaml already carries the rest of the scenario's own
# settings - camera, transition sampling, window length - so those aren't
# duplicated here); `tube_radius_m` overrides just that one scenario field
# and is shared with the viz stage below so a sweep produces matching
# manifests and maps for the same radius.
#
# `tube_radius_m` is the swept CONOPS/altitude parameter CLAUDE.md rule 4
# requires ("tube radius is a configurable input, not a constant... never
# hardcoded"): re-run with a different value here, or one-off with
# `dvc exp run --set-param manifest.tube_radius_m=<value>`, rather than
# editing the scenario file or ManifestBuilder itself.
manifest:
  scenario: configs/scenarios/san_jose_downtown.yaml
  tube_radius_m: 250.0
  output: data/manifests/san_jose_downtown.json
  # A folium review map of the built manifest bundle - kept alongside the
  # manifest itself (not under out/viz/) so it doesn't collide with the
  # viz stage's own out/viz/ directory output below.
  map: data/manifests/san_jose_downtown_review.html

viz:
  output_dir: out/viz

# Phase 2 (data/ground_truth/ - implemented as `csnav.data.ground_truth`) -
# rasterize CSJ street geometry/widths into panoptic labels over imagery
# tiles, see docs/phase2_ground_truth_rasterization.md and
# docs/INTEGRATION_PLAN.md §5.
#
# `vintages` pairs one already-fetched imagery vintage (a directory of
# {level}_{row}_{col}.tif tiles, e.g. one of fetch_imagery's per-service
# output subdirectories) with the street-network snapshot that matches it -
# `streets.output` (the current pull) for the current cache, or a separate
# archived GeoJSON (see `scripts/fetch_csj_streets.py --historic-moment`) for
# an older one. Add another entry here - not another stage in dvc.yaml - to
# bring another imagery vintage into the training set; the `build_ground_truth`
# stage below is a `foreach` over this map, so each entry gets its own run and
# its own output directory automatically.
ground_truth:
  vintages:
    current:
      imagery_dir: data/raw/dpw_imagery/DPW_ImageryCached2025
      streets_geojson: data/raw/csj_streets/aoi.geojson
  # Fallback roadway width (meters) when a street segment carries none of
  # CSJ's own width fields - CLAUDE.md's "config lives in versioned config
  # files" convention, not a constant in csnav.data.ground_truth.rasterize.
  default_width_m: 6.0
  # Radius (meters) a derived road-road intersection is rasterized as.
  intersection_radius_m: 3.0
  # Clustering tolerance (meters) for merging nearby computed junction points
  # into one intersection instance.
  intersection_snap_m: 2.0
  output_dir: data/ground_truth
  # Sibling of viz.output_dir (out/viz), not nested inside it - DVC treats
  # out/viz as one tracked directory owned by the visualize_trajectories
  # stage, and rejects another stage's output living inside it.
  viz_output_dir: out/viz_ground_truth
  check_report: ground_truth_check_report.json
