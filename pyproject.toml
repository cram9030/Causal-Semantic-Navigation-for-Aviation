[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csnav"
version = "0.1.0"
description = "Causal Semantic Navigation for Aviation - data pipeline and models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "Pillow>=10.0",
    "tqdm>=4.66",
    # Phase 1 (trajectory/): metric buffering and clipping for the RNP tube and
    # manifest footprints, the trajectory/slice graph type, and the versioned
    # scenario config format.
    "shapely>=2.0",
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
]
# Phase 1 (viz/) visualization: interactive Plotly figures of the transition
# graph and route profiles, and interactive Leaflet maps of tubes, transition
# families, window footprints, and imagery tiles. Both emit self-contained
# HTML. Kept optional so the data pipeline installs without a plotting stack.
viz = [
    "plotly>=5.20",
    "folium>=0.15",
]
# Phase 2 (segmentation/) fine-tuning deps: torch/torchvision's Linux wheels
# on PyPI bundle CUDA support by default, so `pip install torch` picks up the
# GPU automatically when one is visible to the process - no separate
# --index-url needed. See .devcontainer/ for the GPU-enabled dev container.
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.44",
    "scikit-learn>=1.4",
]
# Data/pipeline version control (see docs/ data-VCS comparison) for
# dvc.yaml + params.yaml: acquisition pipeline reproducibility and, later,
# tube-radius/manifest and segmentation-checkpoint tracking. No cloud
# remote extra (dvc[s3]/dvc[gs]/dvc[azure]) is pinned yet - add one once a
# storage backend is chosen; see README's "Data versioning (DVC)" section.
dvc = [
    "dvc>=3.55,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

# The window selector's behaviour lives in a real .js file (so it can be linted
# and unit-tested under node) that gets inlined into every map it is added to.
[tool.setuptools.package-data]
"csnav.viz" = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
